#config_version=6

hardware:
  platform: opp
  driverboards: gen2
  segment_displays: light_segment_displays

opp:
  #Use the USB ports defined by your OS for the two STM32 boards
  ports: /dev/ttyACM0
  chains:
    0: /dev/ttyACM0
  debug: true

config:
  - neoSeg_0.yaml
  - neoSeg_1.yaml
  - neoSeg_2.yaml
  - neoSeg_3.yaml
  - neoSeg_4.yaml

machine:
  balls_installed: 3

game:
  balls_per_game: 3
  max_players: 4


