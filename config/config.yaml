#config_version=5

hardware:
  platform: opp
  driverboards: gen2
  segment_displays: light_segment_displays

opp:
  #Use the USB ports defined by your OS for the two STM32 boards
  ports: /dev/ttyACM1
  chains:
    0: /dev/ttyACM1
  debug: true

config:
  - neoSeg_0.yaml
  - neoSeg_1.yaml
  - neoSeg_2.yaml
  - neoSeg_3.yaml
  - neoSeg_4.yaml

switches:
  s_left_flipper:
    number: 0-0-1
  s_right_flipper:
    number: 0-0-2

machine:
  balls_installed: 3

game:
  balls_per_game: 3
  max_players: 4

keyboard:
  z:
    switch: s_left_flipper
  "/":
    switch: s_right_flipper
